name: Migrations · produção

# Merge em main aplica as migrations pendentes no projeto de produção.
# O ambiente "prod" no GitHub pode exigir aprovação antes deste job rodar.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-prod.yml"
  workflow_dispatch:

concurrency:
  group: migrations-prod
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    environment: prod

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - run: supabase db push --dry-run
      - run: supabase db push
